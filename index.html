<!DOCTYPE html>
<html>
  <head>
    <base href="/wazstudio-site/"/>
    <meta charset="utf-8"/>
    <script>
      (function(){var s=localStorage.getItem('wazstudio-theme');var t=s||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();
    </script>
    <!--$-->
    <title>wazstudio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--/-->
    <script src="main.client.dart.js" defer></script>
    <style>
      @import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap);
      :root {
        --primary: #2F4C81;
        --primary-dark: #1E3A66;
        --bg: #F7F2E7;
        --surface: #FFFFFF;
        --border: #E6DFCE;
        --text: #1B2A45;
        --muted-text: #5B6B85;
        --blob-blue: #5C7FB3;
        --blob-green: #7FAE93;
        --blob-terracotta: #C97256;
        --blob-blend: multiply;
        --blob-opacity: 0.6;
      }
      :root[data-theme="dark"] {
        --primary: #7C9CDB;
        --primary-dark: #9DB6E5;
        --bg: #0A0A0F;
        --surface: #15151F;
        --border: #23232F;
        --text: #F5F5F7;
        --muted-text: #9CA3AF;
        --blob-blue: #5C7FB3;
        --blob-green: #7FAE93;
        --blob-terracotta: #C97256;
        --blob-blend: screen;
        --blob-opacity: 0.35;
      }
      html, body {
        width: 100%;
        min-height: 100vh;
        padding: 0;
        margin: 0;
        color: var(--text);
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      * {
        box-sizing: border-box;
      }
      h1, h2, h3 {
        margin: 0;
      }
      p {
        margin: 0;
      }
      a {
        color: var(--primary);
      }
      .theme-toggle .icon-moon {
        display: none;
      }
      :root[data-theme="dark"] .theme-toggle .icon-sun {
        display: none;
      }
      :root[data-theme="dark"] .theme-toggle .icon-moon {
        display: block;
      }
      .main {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }
      .content {
        display: flex;
        position: relative;
        z-index: 1;
        min-height: 100vh;
        flex-direction: column;
      }
      footer {
        display: flex;
        padding-top: 2em;
        padding-bottom: 2em;
        border-top-style: solid;
        border-top-color: var(--border);
        border-top-width: 1px;
        justify-content: center;
      }
      footer p {
        color: var(--muted-text);
        font-size: 0.875rem;
      }
      header {
        display: flex;
        max-width: 1100px;
        padding: 1.5em 2em;
        margin-left: auto;
        margin-right: auto;
        justify-content: space-between;
        align-items: center;
      }
      header .brand {
        text-decoration: none;
      }
      header .brand div {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header .brand .mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background-color: var(--primary);
      }
      header .brand span {
        color: var(--text);
        font-size: 1.1rem;
        font-weight: 800;
      }
      header .nav-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header nav {
        display: flex;
        gap: 4px;
      }
      header nav a {
        display: flex;
        padding: 0.5em 1em;
        color: var(--muted-text);
        font-weight: 500;
        text-decoration: none;
      }
      header nav a:hover {
        color: var(--text);
      }
      header nav div.active a {
        color: var(--text);
      }
      header .theme-toggle {
        display: flex;
        width: 36px;
        height: 36px;
        border: solid var(--border) 1px;
        border-radius: 999px;
        justify-content: center;
        align-items: center;
        font-size: 1rem;
        background-color: var(--surface);
        cursor: pointer;
      }
      header .theme-toggle:hover {
        border-color: var(--primary);
      }
      .watercolor-bg {
        position: fixed;
        top: 0px;
        left: 0px;
        bottom: 0px;
        right: 0px;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .watercolor-bg .blob {
        opacity: var(--blob-opacity);
        filter: blur(120px);
        mix-blend-mode: var(--blob-blend);
      }
      .watercolor-bg .blob-blue {
        position: absolute;
        top: -15vh;
        left: -15vw;
        width: 55vw;
        height: 55vh;
        border-radius: 60% 40% 60% 40% / 40% 60% 40% 60%;
        background-color: var(--blob-blue);
      }
      .watercolor-bg .blob-green {
        position: absolute;
        top: 20vh;
        left: 35vw;
        width: 45vw;
        height: 45vh;
        border-radius: 30% 70% 30% 70% / 70% 30% 70% 30%;
        background-color: var(--blob-green);
      }
      .watercolor-bg .blob-terracotta {
        position: absolute;
        bottom: -20vh;
        right: -10vw;
        width: 50vw;
        height: 50vh;
        border-radius: 50% 50% 60% 40% / 60% 40% 50% 50%;
        background-color: var(--blob-terracotta);
      }
      .page {
        display: flex;
        width: 100%;
        max-width: 700px;
        padding: 8em 2em;
        margin-left: auto;
        margin-right: auto;
        flex-direction: column;
        gap: 16px;
      }
      .page h1 {
        font-size: 2.5rem;
        font-weight: 800;
      }
      .page p {
        color: var(--muted-text);
        font-size: 1.1rem;
        line-height: 1.6;
      }
      .page {
        display: flex;
        width: 100%;
        max-width: 700px;
        padding: 8em 2em;
        margin-left: auto;
        margin-right: auto;
        flex-direction: column;
        gap: 16px;
      }
      .page h1 {
        font-size: 2.5rem;
        font-weight: 800;
      }
      .page p {
        color: var(--muted-text);
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="watercolor-bg">
        <div class="blob blob-blue"></div>
        <div class="blob blob-green"></div>
        <div class="blob blob-terracotta"></div>
      </div>
      <div class="content">
        <header>
          <a class="brand" href="/"><div><div class="mark"></div><span>wazstudio</span></div></a>
          <div class="nav-group">
            <nav><div class="active"><a href="/">Home</a></div><div><a href="/about">About</a></div></nav>
            <button class="theme-toggle" type="button" aria-label="Toggle color theme" onclick="var r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);localStorage.setItem('wazstudio-theme',n);"><span class="icon-sun">☀</span><span class="icon-moon">☾</span></button>
          </div>
        </header>
        <section class="page"><h1>Home</h1><p>Page content coming soon.</p></section>
        <footer><p>© 2026 wazstudio</p></footer>
      </div>
    </div>
  </body>
</html>
