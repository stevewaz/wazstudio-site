<!DOCTYPE html>
<html>
  <head>
    <base href="/wazstudio-site/"/>
    <meta charset="utf-8"/>
    <style>
      @import url(https://fonts.googleapis.com/css?family=Roboto);
      html, body {
        width: 100%;
        min-height: 100vh;
        padding: 0;
        margin: 0;
        font-family: 'Roboto', sans-serif;
      }
      h1 {
        margin: unset;
        font-size: 4rem;
      }
    </style>
    <!--$-->
    <title>About · wazstudio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--/-->
    <script src="main.client.dart.js" defer></script>
    <style>
      @import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap);
      html, body {
        width: 100%;
        min-height: 100vh;
        padding: 0;
        margin: 0;
        color: #F5F5F7;
        font-family: 'Inter', sans-serif;
        background-color: #0A0A0F;
      }
      * {
        box-sizing: border-box;
      }
      h1, h2, h3 {
        margin: 0;
      }
      p {
        margin: 0;
      }
      a {
        color: #6366F1;
      }
      .main {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
      }
      .app-card {
        display: flex;
        padding: 1.5em;
        border: solid #23232F 1px;
        border-radius: 16px;
        flex-direction: column;
        gap: 12px;
        background-color: #15151F;
      }
      .app-card .badge {
        padding: 4px 10px;
        border-radius: 999px;
        align-self: flex-start;
        color: #6366F1;
        font-size: 0.75rem;
        font-weight: 600;
        background-color: #6366F11A;
      }
      .app-card h3 {
        font-size: 1.25rem;
        font-weight: 700;
      }
      .app-card p {
        color: #9CA3AF;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      footer {
        display: flex;
        padding-top: 2em;
        padding-bottom: 2em;
        border-top-style: solid;
        border-top-color: #23232F;
        border-top-width: 1px;
        justify-content: center;
      }
      footer p {
        color: #9CA3AF;
        font-size: 0.875rem;
      }
      header {
        display: flex;
        max-width: 1100px;
        padding: 1.5em 2em;
        margin-left: auto;
        margin-right: auto;
        justify-content: space-between;
        align-items: center;
      }
      header .brand {
        text-decoration: none;
      }
      header .brand div {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      header .brand .mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background-color: #6366F1;
      }
      header .brand span {
        color: #F5F5F7;
        font-size: 1.1rem;
        font-weight: 800;
      }
      header nav {
        display: flex;
        gap: 4px;
      }
      header nav a {
        display: flex;
        padding: 0.5em 1em;
        color: #9CA3AF;
        font-weight: 500;
        text-decoration: none;
      }
      header nav a:hover {
        color: #F5F5F7;
      }
      header nav div.active a {
        color: #F5F5F7;
      }
      .about {
        display: flex;
        width: 100%;
        max-width: 700px;
        padding: 6em 2em;
        margin-left: auto;
        margin-right: auto;
        flex-direction: column;
        gap: 16px;
      }
      .about h1 {
        font-size: 2.5rem;
        font-weight: 800;
      }
      .about p {
        color: #9CA3AF;
        font-size: 1.1rem;
        line-height: 1.6;
      }
      .home {
        display: flex;
        width: 100%;
        max-width: 1100px;
        padding-left: 2em;
        padding-right: 2em;
        margin-left: auto;
        margin-right: auto;
        flex-direction: column;
      }
      .home .hero {
        display: flex;
        padding-top: 6em;
        padding-bottom: 6em;
        flex-direction: column;
        align-items: start;
        gap: 16px;
      }
      .home .hero .eyebrow {
        color: #6366F1;
        font-size: 0.9rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .home .hero h1 {
        max-width: 700px;
        font-size: 3rem;
        font-weight: 800;
        line-height: 1.15;
      }
      .home .hero .subtitle {
        max-width: 560px;
        color: #9CA3AF;
        font-size: 1.15rem;
        line-height: 1.6;
      }
      .home .apps {
        display: flex;
        padding-top: 3em;
        padding-bottom: 3em;
        flex-direction: column;
        gap: 24px;
      }
      .home .apps h2 {
        font-size: 1.75rem;
        font-weight: 700;
      }
      .home .apps .app-grid {
        display: grid;
        grid-template-columns: 1.0fr 1.0fr 1.0fr;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <header>
        <a class="brand" href="/"><div><div class="mark"></div><span>wazstudio</span></div></a>
        <nav><div><a href="/">Home</a></div><div class="active"><a href="/about">About</a></div></nav>
      </header>
      <section class="about">
        <h1>About wazstudio</h1>
        <p>
          wazstudio is a small studio building focused, well-made apps. We'd rather ship a few things well than a lot of things half-finished.
        </p>
        <p>More about our apps and how to reach us is coming soon.</p>
      </section>
      <footer><p>© 2026 wazstudio</p></footer>
    </div>
  </body>
</html>
